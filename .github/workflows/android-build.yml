name: Android CI - Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Lint
      run: ./gradlew lintRelease
      continue-on-error: true

    - name: Inspect Cloud Save SDK classes
      run: |
        ./gradlew dependencies --configuration releaseRuntimeClasspath | grep cloudsave || true
        find ~/.gradle/caches -name "tap-cloudsave*.aar" -o -name "tap-cloudsave*.jar" | head -5 | while read f; do
          echo "=== $f ==="
          if [[ "$f" == *.aar ]]; then
            unzip -l "$f" | grep classes.jar && unzip -p "$f" classes.jar > /tmp/classes.jar && jar tf /tmp/classes.jar | grep -i "archive\|CloudSave" | sort
          else
            jar tf "$f" | grep -i "archive\|CloudSave" | sort
          fi
        done
      continue-on-error: true

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk

    - name: Get version and date
      id: version
      run: |
        echo "version=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        files: |
          app/build/outputs/apk/release/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Output Download Link
      run: |
        echo ""
        echo "========================================"
        echo "  APK Download Link:"
        echo "  https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}"
        echo "========================================"
        echo ""
