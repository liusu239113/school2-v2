name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.0.0-r*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/school2-release.p12"
          chmod 600 "$RUNNER_TEMP/signing/school2-release.p12"

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/signing/school2-release.p12
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Verify package and version
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "name='com.arktools.xiaozhang.v2'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionCode='201'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionName='1.0.0'" "$RUNNER_TEMP/apk-badging.txt"

      - name: Rename and checksum APK
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk school2-v1.0.0-r2-release.apk
          sha256sum school2-v1.0.0-r2-release.apk | tee school2-v1.0.0-r2-release.apk.sha256

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: school2-v1.0.0-r2-signed
          path: |
            school2-v1.0.0-r2-release.apk
            school2-v1.0.0-r2-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create v1.0.0-r2 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-r2
          name: 校长我来当 2 v1.0.0 修订版 2
          files: |
            school2-v1.0.0-r2-release.apk
            school2-v1.0.0-r2-release.apk.sha256
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
